<style>

/* ================= PUSH / MODAL / DROPDOWN ================= */
function push(o){
 o=Object.assign({icon:'bell',title:'',sub:'',action:'',dur:4800,onClick:null},o);
 const stack=qs('#pushStack');if(!stack)return;
 while(stack.children.length>=3)stack.firstElementChild.remove();
 const el=document.createElement('div');el.className='push';
 el.innerHTML=`<span class="pic"><i data-lucide="${o.icon}"></i></span>
  <span class="pt"><b>${esc(o.title)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}${o.action?`<span style="display:block;font-size:11px;font-weight:700;color:var(--blue);margin-top:5px">${esc(o.action)} →</span>`:''}</span>
  <button class="px"><i data-lucide="x"></i></button>

 function kill(){el.classList.add('out');setTimeout(()=>el.remove(),260)}
 el.querySelector('.px').addEventListener('click',e=>{e.stopPropagation();kill()});
 el.addEventListener('click',()=>{o.onClick&&o.onClick();kill()});
 el.querySelector('.prog i').addEventListener('animationend',kill);
 stack.appendChild(el);refreshIcons();
}

/* ================= METRIK ================= */
function shopMetrics(d){
 const done=(d.queue||[]).filter(q=>q.status==='selesai');
 const rev=done.reduce((a,q)=>a+(q.total||0),0);
 const exp=(d.expenses||[]).reduce((a,e)=>a+(e.amount||0),0);
 const kas=(d.kasbon||[]).reduce((a,k)=>a+(k.amount||0),0);
 const paid=done.filter(q=>q.paidAt>=Date.now()-30*DAY_MS);
 const rev30=paid.reduce((a,q)=>a+(q.total||0),0);
 return{rev,exp,kas,gross:rev-exp,net:rev-exp-kas,cust:(d.customers||[]).length,
  trx:done.length,trx30:paid.length,rev30,avg:done.length?Math.round(rev/done.length):0};
}
function shopSeries(d,days){
 const out=[];const now=new Date();
 for(let i=days-1;i>=0;i--){const dt=new Date(now);dt.setDate(now.getDate()-i);out.push({key:dkey(dt),lab:dt.getDate()+' '+MON[dt.getMonth()],rev:0,trx:0})}
 (d.queue||[]).forEach(q=>{if(q.status!=='selesai')return;const f=out.find(x=>x.key===dkey(q.paidAt));if(f){f.rev+=q.total||0;f.trx++}});
 return out;
}

function setLoginLoading(on){
 const b=qs('#loginBtn');if(!b)return;
 b.disabled=on;

function friendlyAuthError(e){
 const c=(e&&e.code)||'';
 if(c.includes('invalid-email'))return 'Format email tidak valid.';
 if(c.includes('wrong-password')||c.includes('invalid-credential'))return 'Email atau password salah.';
 if(c.includes('user-not-found'))return 'Akun tidak ditemukan.';
 if(c.includes('email-already-in-use'))return 'Email sudah terdaftar — gunakan email lain.';
 if(c.includes('weak-password'))return 'Password terlalu lemah (minimal 6 karakter).';
 if(c.includes('too-many-requests'))return 'Terlalu banyak percobaan. Coba lagi nanti.';
 if(c.includes('network-request-failed'))return 'Koneksi bermasalah. Periksa internetmu.';
 return (e&&e.message)||'Terjadi kesalahan.';
}
async function doLogin(){
 if(!fbAuth)return toast('Firebase belum siap — muat ulang halaman.','alert-triangle',true);
 const email=qv('#lgEmail').toLowerCase(),pass=qv('#lgPass');
 qs('#lgErr').classList.add('hide');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return authFail('Format email tidak valid.');
 if(pass.length<6)return authFail('Password minimal 6 karakter.');
 setLoginLoading(true);
 try{
  try{await fbAuth.signInWithEmailAndPassword(email,pass)}
  catch(e){
   if(e.code==='auth/user-not-found'){await fbAuth.createUserWithEmailAndPassword(email,pass);toast('Akun admin baru dibuat.')}
   else throw e;
  }
 }catch(e){
  authFail(friendlyAuthError(e));
 }
}
function authFail(m){const e=qs('#lgErr');e.classList.remove('hide');e.querySelector('span').textContent=m;refreshIcons();setLoginLoading(false)}

async function ensureAdmin(u){
 adminRef=fdb.collection('admins').doc(u.uid);
 const snap=await adminRef.get().catch(()=>null);
 if(snap&&snap.exists){
  const d=snap.data()||{};
  ME={name:d.name||u.displayName||'Admin',email:d.email||u.email,photo:d.photo||u.photoURL||'',
   createdAt:d.createdAt||Date.now(),role:d.role||'Super Admin',
   gallery:Array.isArray(d.gallery)?d.gallery:[]};
  await adminRef.set({name:ME.name,email:ME.email,photo:ME.photo,gallery:ME.gallery},{merge:true});
 }else{
  ME={name:u.displayName||'Admin',email:u.email||'',photo:u.photoURL||'',createdAt:Date.now(),role:'Super Admin',gallery:[]};
  await adminRef.set({name:ME.name,email:ME.email,photo:ME.photo,createdAt:ME.createdAt,role:ME.role,branches:[],gallery:[]});
  const own=await fdb.collection('shops').doc(u.uid).get().catch(()=>null);
  if(own&&own.exists){await adminRef.set({branches:[u.uid]},{merge:true});TRACKED=[u.uid]}
 }
}

async function createBranch(){
 const name=qv('#nbName'),email=qv('#nbEmail').toLowerCase(),pass=qv('#nbPass'),addr=qv('#nbAddr'),plan=qs('#nbPlan')?qs('#nbPlan').value:'gold';
 if(name.length<2)return toast('Isi nama barbershop.','alert-triangle',true);
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Format email tidak valid.','alert-triangle',true);
 if(pass.length<6)return toast('Password minimal 6 karakter.','alert-triangle',true);
 if(TRACKED.length>=50)return toast('Maksimal 50 cabang dipantau.','alert-triangle',true);
 const btn=qs('#nbGo');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Membuat akun...'}
 try{
  let secApp;
  try{secApp=firebase.apps.find(a=>a.name==='branchCreator')||firebase.initializeApp(FB_CFG,'branchCreator')}
  catch(e){secApp=firebase.app('branchCreator')}
  const secAuth=secApp.auth();
  const cred=await secAuth.createUserWithEmailAndPassword(email,pass);
  const newUid=cred.user.uid;
  await secAuth.signOut();
  const shopDoc={email,plan,seq:1001,notifSeen:0,planRequests:[],
   payments:{qris:{on:true,img:''},debit:{on:true,note:''},transfer:{on:true,accounts:[]}},
   shop:{name,title:'',logo:'',address:addr,footer:'Terima kasih telah berkunjung di '+name+'!',printer:false},
   profile:{name:'Admin',photo:'',bg:'',maps:'',address:addr,gallery:[]},
   customers:[],capsters:[],staff:[],services:[],products:[],queue:[],bookings:[],expenses:[],kasbon:[],chats:[],
   createdAt:Date.now(),updatedAt:Date.now()};
  await fdb.collection('shops').doc(newUid).set(shopDoc);
  if(!TRACKED.includes(newUid)){TRACKED.push(newUid);saveAdmin({branches:TRACKED})}
  ALL.push({uid:newUid,email,name,address:addr,photo:'',plan,raw:shopDoc});
  closeModal();
  S.brSearch='';
  toast('Cabang "'+name+'" dibuat!','store');
  push({icon:'store',title:'Akun cabang siap',sub:email+' bisa langsung login di aplikasi Kasir BarberGo.',dur:6000});
  render();
 }catch(e){
  toast(friendlyAuthError(e),'alert-triangle',true);

 }
}

function brQueueTab(t){
 S.brQueueTab=t;
 const w=qs('#bqChipW'),d=qs('#bqChipD');
 if(w)w.classList.toggle('on',t==='menunggu');
 if(d)d.classList.toggle('on',t==='selesai');

 if(el&&s){el.innerHTML=brQueueListHTML(s);refreshIcons()}
}
function brQueueListHTML(s){
 const t=S.brQueueTab||'menunggu';
 const list=(s.raw.queue||[]).filter(q=>q.status===t).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 if(!list.length)return `<div class="empty" style="padding:18px 8px"><i data-lucide="${t==='menunggu'?'clock':'check-circle-2'}"></i><p>Tidak ada antrian ${t}.</p></div>`;
 return `<div class="scr-box">${list.map(q=>{
  const items=(q.items||[]).map(i=>esc(i.name)+(i.qty>1?' ×'+i.qty:'')).join(', ');
  const isWait=q.status==='menunggu';
  const tm=isWait?ftime(q.createdAt||Date.now()):ftime(q.paidAt||q.createdAt||Date.now());
  return `<div class="rrow">
   <span class="qno">${String(q.no||0).slice(-2).padStart(2,'0')}</span>
   <div class="in"><b>${esc(q.name||'-')}</b><small>${items||'-'} · <span class="mono">${esc(q.phone||'')}</span></small></div>
   ${isWait?'<span class="badge b-pend">Menunggu</span>':`<span class="badge b-paid">${esc((q.method||'cash').toUpperCase())}</span>`}
   <span class="mono" style="font-size:11px;color:var(--tx2);flex:none">${tm}</span>
   <span class="amt" style="color:${isWait?'var(--tx2)':'var(--blue)'}">${fmt(q.total)}</span>
  </div>`}).join('')}</div>`;
}

function epPickPhoto(){const i=qs('#epPhotoIn');if(i)i.click()}
function galGridHTML(){
 const g=ME.gallery||[];
 return g.map((src,i)=>`<div class="gal"><img src="${esc(src)}" alt=""><button onclick="AD.galDel(${i})" title="Hapus foto"><i data-lucide="trash-2" style="width:13px;height:13px"></i></button></div>`).join('')+
 `<button class="gal-add" onclick="AD.epPickGal()"><i data-lucide="image-plus"></i>Upload foto</button>`;
}
function epPickGal(){const i=qs('#galIn');if(i)i.click()}
async function galPick(input){
 const files=[...input.files];if(!files.length)return;
 ME.gallery=ME.gallery||[];
 let ok=0;
 for(let i=0;i<files.length;i++){
  toast(`Mengunggah foto ${i+1}/${files.length} ke Cloudinary...`,'upload');
  try{
   const url=await cloudUpload(files[i]);
   ME.gallery.push(url);ok++;
   saveAdmin({gallery:ME.gallery});
  }catch(e){toast('Gagal upload foto '+(i+1)+': '+(e.message||e),'alert-triangle',true)}
 }
 if(ok){
  render();
  toast(ok+' foto ditambahkan ke gallery.','image');
 }
}
function galDel(i){
 ME.gallery.splice(i,1);
 saveAdmin({gallery:ME.gallery});
 const el=qs('#galGrid');if(el)el.innerHTML=galGridHTML();
 const c=qs('#galCount');if(c)c.textContent=(ME.gallery||[]).length+' foto';
 refreshIcons();
 toast('Foto dihapus dari gallery.','trash-2');
}
async function pickAdminPhoto(input){
 const file=input.files[0];if(!file)return;
 const holder=qs('#epPhotoBox')||input.parentNode;
 const local=await fileToDataURL(file);
 const old=holder.innerHTML;
 holder.innerHTML=`<img src="${local}">`;holder.classList.add('has-img');
 const spin=document.createElement('div');spin.className='upspin';spin.innerHTML='<span class="spin"></span> Mengunggah...';
 holder.appendChild(spin);
 try{
  const url=await cloudUpload(file);
  ME.photo=url;saveAdmin({photo:url});
  spin.remove();render();
  toast('Foto profil diperbarui.','image');
 }catch(e){holder.innerHTML=old;refreshIcons();toast('Upload gagal: '+(e.message||e),'alert-triangle',true)}
}
function saveProfile(){
 const name=qs('#epName')?qv('#epName'):(ME.name||'');
 if(name.length<2)return toast('Nama terlalu pendek.','alert-triangle',true);
 ME.name=name;saveAdmin({name});render();toast('Profil berhasil diperbarui.','check');
}

/* ================= CHART (admin) ================= */
function adLineChart(series,id){
 const W=760,Hh=280,L=56,R=16,T=14,B=30,iw=W-L-R,ih=Hh-T-B;
 const max=Math.max(...series.map(x=>x.rev),1);
 const nice=v=>{if(v<=0)return 1e5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p};
 const mx=nice(max);
 const X=i=>L+i*(iw/(series.length-1)),Y=v=>T+ih-(v/mx)*ih;
 const maxT=Math.max(...series.map(x=>x.trx),1);
 const Yt=v=>T+ih-(v/maxT)*ih;
 const pts=series.map((s,i)=>({x:X(i),y:Y(s.rev),ty:Yt(s.trx)}));
 window['ADPT_'+id]=pts;window['ADSR_'+id]=series;
 const smooth=arr=>{let d='M'+arr[0].x+' '+arr[0].y;for(let i=0;i<arr.length-1;i++){const p0=arr[Math.max(0,i-1)],p1=arr[i],p2=arr[i+1],p3=arr[Math.min(arr.length-1,i+2)];d+=` C ${(p1.x+(p2.x-p0.x)/6).toFixed(1)} ${(p1.y+(p2.y-p0.y)/6).toFixed(1)}, ${(p2.x-(p3.x-p1.x)/6).toFixed(1)} ${(p2.y-(p3.y-p1.y)/6).toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`}return d};
 let grid='';for(let g=0;g<=4;g++){const gy=T+ih-(g/4)*ih;grid+=`<line x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}" stroke="var(--line)"/><text x="${L-8}" y="${gy+4}" text-anchor="end" font-size="10" fill="#94A3B8" font-family="Inter">${sRp(mx*g/4)}</text>`}
 const step=Math.ceil(series.length/8);
 let xl='';series.forEach((s,i)=>{if(i%step===0||i===series.length-1)xl+=`<text x="${pts[i].x}" y="${Hh-8}" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="Inter">${s.lab}</text>`});
 const line=smooth(pts),area=line+` L ${pts[pts.length-1].x} ${T+ih} L ${pts[0].x} ${T+ih} Z`;
 const tline=smooth(pts.map(p=>({x:p.x,y:p.ty})));
 return `<div class="chartBox"><svg id="adch_${id}" viewBox="0 0 ${W} ${Hh}" style="width:100%;display:block">${grid}${xl}
  <path d="${area}" fill="rgba(37,99,235,.12)"/><path d="${line}" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="${tline}" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="4 4" opacity=".7"/>
  <circle id="addot_${id}" r="4.5" fill="#2563EB" stroke="#fff" stroke-width="2" cx="-20" cy="-20" style="opacity:0"/></svg>
  <div class="ctip" id="adtip_${id}"></div></div>`;
}
function adBindChart(id){
 const svg=qs('#adch_'+id);if(!svg)return;
 const tip=qs('#adtip_'+id),dot=qs('#addot_'+id),pts=window['ADPT_'+id],sr=window['ADSR_'+id],W=760,Hh=280;
 svg.addEventListener('mousemove',e=>{
  const r=svg.getBoundingClientRect();const vx=(e.clientX-r.left)/r.width*W;
  let best=0,bd=1e9;pts.forEach((p,i)=>{const d=Math.abs(p.x-vx);if(d<bd){bd=d;best=i}});
  const p=pts[best],s=sr[best];
  dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);dot.style.opacity=1;
  tip.style.display='block';tip.style.left=(p.x/W*100)+'%';tip.style.top=(p.y/Hh*100)+'%';
  tip.innerHTML=`${s.lab}<b>${fmt(s.rev)}</b>${s.trx} transaksi`;
 });
 svg.addEventListener('mouseleave',()=>{dot.style.opacity=0;tip.style.display='none'});
}

/* ================= EXPORT CSV ================= */
function csvDownload(rows,label){
 const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
 a.download=`barbergo-${label}.csv`;a.click();
}
function exportAllCSV(){
 const rows=[['Cabang','Email','Kode','Tanggal','Pelanggan','Metode','Total']];
 trackedShops().forEach(s=>(s.raw.queue||[]).filter(q=>q.status==='selesai').forEach(q=>
  rows.push([s.name,s.email,'TRX-'+String(q.no||0).padStart(5,'0'),dkey(q.paidAt),q.name,(q.method||'').toUpperCase(),q.total||0])));
 csvDownload(rows,'laporan-semua-cabang-'+todayKey());
 toast('Laporan semua cabang di-export.','file-down');
}
function exportBranchCSV(uid2){
 const s=branchByUid(uid2);if(!s)return;
 const rows=[['Kode','Tanggal','Jam','Pelanggan','Metode','Total']];
 (s.raw.queue||[]).filter(q=>q.status==='selesai').sort((a,b)=>a.paidAt-b.paidAt).forEach(q=>
  rows.push(['TRX-'+String(q.no||0).padStart(5,'0'),dkey(q.paidAt),ftime(q.paidAt),q.name,(q.method||'').toUpperCase(),q.total||0]));
 csvDownload(rows,'cabang-'+s.name.replace(/\s+/g,'-').toLowerCase()+'-'+todayKey());
 toast('Laporan '+s.name+' di-export.','file-down');
}

/* ================= BOOT ================= */
(function boot(){
 try{
  applyTheme();refreshIcons();
  qs('#hDate').textContent=fdateL(new Date());
  if(!fbAuth){toast('Firebase gagal dimuat — periksa koneksi.','alert-triangle',true);return}
  fbAuth.onAuthStateChanged(async u=>{
   if(!u){
    qs('#app').classList.add('hide');qs('#login').classList.remove('hide');
    setLoginLoading(false);return;
   }
   qs('#login').classList.add('hide');qs('#app').classList.remove('hide');
   try{
    await ensureAdmin(u);
    await loadTracked();
    await loadAllShops();
    render();
   }catch(e){
    console.error(e);
    toast('Gagal memuat data: '+(e.message||e),'alert-triangle',true);
   }
  });
 }catch(e){console.error('boot:',e)}
})();
