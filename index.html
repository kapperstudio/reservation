<style>
:root{
 --blue:#0B2FD1;--blue2:#2563EB;--bluesoft:#E8F0FF;--bk:#0F172A;
 --bg:#F8FAFC;--card:#FFFFFF;--tx:#0F172A;--tx2:#64748B;--tx3:#94A3B8;
 --bd:#E2E8F0;--line:#EDF2F7;--hov:#F1F5F9;--soft2:#F1F5F9;--selbg:#E8F0FF;
 --gr:#16A34A;--wn:#F59E0B;--dn:#EF4444;
 --r:14px;--sh:0 1px 3px rgba(15,23,42,.05)
}
body.dark{--bg:#0A1020;--card:#0F172A;--tx:#F1F5F9;--tx2:#94A3B8;--tx3:#64748B;--bd:#1E293B;--line:#182338;--hov:#16213A;--soft2:#1E293B;--selbg:rgba(37,99,235,.2);--sh:0 1px 3px rgba(0,0,0,.5)}

html{scrollbar-color:#CBD5E1 var(--bg)}

.mono{font-family:'JetBrains Mono',monospace}
.hide{display:none!important}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,47,209,.14)}
label.f{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin:13px 0 6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

a{color:inherit;text-decoration:none}

.btn.pri{background:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue2)}

#fnav{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:99px;box-shadow:0 10px 34px rgba(15,23,42,.22);padding:6px;z-index:80;gap:2px}

.dacts{display:flex;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
.dacts .btn{height:44px;min-width:150px;font-size:13px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;align-items:start}
@media(max-width:760px){.dgrid{grid-template-columns:1fr}}
.dcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.galrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.galrow img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in}
.caprow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.caprow:last-child{border-bottom:none}
.caprow .cdot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
.cav{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx2);flex:none}
.cav img{width:100%;height:100%;object-fit:cover}
.caprow b{font-size:12.5px;display:block}
.caprow small{font-size:11px;color:var(--tx2)}
.svcrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.svcrow:last-child{border-bottom:none}
.svcrow .pr{font-family:'JetBrains Mono';font-weight:700}
/* upload boxes */
.upbg{position:relative;height:110px;border-radius:12px;overflow:hidden;margin-top:12px;cursor:pointer;background:linear-gradient(120deg,#0B2FD1,#2563EB)}
.upbg img{width:100%;height:100%;object-fit:cover;display:block}
.upbg .uplbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:12px;font-weight:600;gap:7px}
.upbg .uptag{position:absolute;bottom:8px;right:8px;background:rgba(15,23,42,.65);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.upava{width:62px;height:62px;border-radius:50%;border:3px solid var(--card);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;overflow:hidden;cursor:pointer;flex:none;box-shadow:0 3px 10px rgba(15,23,42,.15)}
.upava img{width:100%;height:100%;object-fit:cover}
/* chat */
.chatwrap{display:flex;flex-direction:column;height:100vh;min-height:100vh}
.thr{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border-radius:12px;text-align:left;transition:.12s}
.thr:hover{background:var(--hov)}
.thr b{font-size:13px;display:block}
.thr small{font-size:11.5px;color:var(--tx2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.thr .tm{margin-left:auto;text-align:right;flex:none}
.thr .tm small{max-width:none}
.unb{min-width:17px;height:17px;border-radius:99px;background:var(--blue);color:#fff;font-size:9.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.room{display:flex;flex-direction:column;flex:1;min-height:0;height:100%;padding:14px;max-width:860px;margin:0 auto;width:100%}
.cr-head{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
.cr-back{display:inline-flex!important}
.msgs{flex:1;overflow-y:auto;padding:16px 4px;display:flex;flex-direction:column;gap:8px;background:var(--hov);border-radius:14px;margin:12px 0}
.bub{max-width:74%;padding:9px 13px;border-radius:13px;font-size:12.5px;line-height:1.5;width:fit-content}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.cust{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.bub .bt{display:block;font-size:9px;opacity:.55;margin-top:3px;text-align:right}
.chat-inp{display:flex;gap:9px}
.chat-inp input{flex:1}
.hrow{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.hrow .in{flex:1;min-width:0}
.hrow .in b{font-size:13px;display:block}
.hrow .in small{font-size:11.5px;color:var(--tx2)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.sk{height:250px;border-radius:16px;background:linear-gradient(90deg,var(--soft2) 25%,var(--hov) 50%,var(--soft2) 75%);background-size:200% 100%;animation:shm 1.1s infinite}
@keyframes shm{to{background-position:-200% 0}}
.okbox{display:flex;gap:10px;align-items:flex-start;background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.4);border-radius:10px;padding:12px 14px;margin-top:12px;color:var(--gr);font-size:12.5px;font-weight:600}
@media(max-width:768px){
 #sidebar{display:none}
 .main{margin-left:0}
 #mhead{display:flex}
 #fnav{display:flex}
 #view{padding:16px 14px 110px}
 #view.in-room{padding:0}
 .dcover{height:150px}
 .dtitle h1{font-size:20px}
 .cta-in{max-width:100%}
 .dacts .btn{flex:1;min-width:0}
}

<script>
/* ================= FIREBASE & CLOUDINARY ================= */
const firebaseConfig={
  apiKey:"AIzaSyCXMkjGhSjnJzZEbZ5_hpZtSEQ-rkl2dbk",
  authDomain:"mattpos.firebaseapp.com",
  projectId:"mattpos",
  storageBucket:"mattpos.firebasestorage.app",
  messagingSenderId:"42578217144",
  appId:"1:42578217144:web:ce1885354d692cce284c4d",
  measurementId:"G-0LZ2SJ8VRJ"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const dbFS=firebase.firestore();
const CLOUD_NAME='o9nnrrra',CLOUD_PRESET='Barbergo';

/* ================= UTIL ================= */
const qs=s=>document.querySelector(s),qsa=s=>[...document.querySelectorAll(s)],qv=s=>{const e=qs(s);return e?e.value.trim():''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const ftime=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function refreshIcons(){try{lucide.createIcons()}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f)})}
function avaHTML(src,name,size){const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px`;
 if(src)return `<span class="pav" style="${st}"><img src="${esc(src)}" alt=""></span>`;
 return `<span class="pav" style="${st}">${esc((name||'?')[0].toUpperCase())}</span>`}
async function cloudUpload(file){
 const fd=new FormData();
 fd.append('file',file);fd.append('upload_preset',CLOUD_PRESET);fd.append('folder','barbergo-customers');
 const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 if(!j.secure_url)throw new Error((j.error&&j.error.message)||'respons tidak valid');
 return j.secure_url;
}

/* ================= PUSH / MODAL / DROPDOWN ================= */
function push(o){
 o=Object.assign({icon:'bell',title:'',sub:'',action:'',dur:4800,onClick:null},o);
 const stack=qs('#pushStack');if(!stack)return;
 while(stack.children.length>=3)stack.firstElementChild.remove();
 const el=document.createElement('div');el.className='push';
 el.innerHTML=`<span class="pic"><i data-lucide="${o.icon}"></i></span>
  <span class="pt"><b>${esc(o.title)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}${o.action?`<span style="display:block;font-size:11px;font-weight:700;color:var(--blue);margin-top:5px">${esc(o.action)} →</span>`:''}</span>
  <button class="px"><i data-lucide="x"></i></button>
  <span class="prog"><i style="animation-duration:${o.dur}ms"></i></span>`;
 function kill(){el.classList.add('out');setTimeout(()=>el.remove(),260)}
 el.querySelector('.px').addEventListener('click',e=>{e.stopPropagation();kill()});
 el.addEventListener('click',()=>{o.onClick&&o.onClick();kill()});
 el.querySelector('.prog i').addEventListener('animationend',kill);
 stack.appendChild(el);refreshIcons();
}
function toast(msg,icon='check-circle-2',err=false){
 const el=push({icon:err?'alert-triangle':icon,title:msg,dur:3000});
 if(err){const p=el.querySelector('.pic');if(p)p.style.background='var(--dn)'}
}
function openModal(html){qs('#modalRoot').innerHTML=`<div class="modal">${html}</div>`;qs('#modalRoot').classList.add('on');qs('#scrim').classList.add('on');refreshIcons()}
function closeModal(){qs('#modalRoot').classList.remove('on');qs('#modalRoot').innerHTML='';qs('#scrim').classList.remove('on')}
function ddToggle(id,e){e&&e.stopPropagation();const d=qs('#'+id);const was=d.classList.contains('open');qsa('.dd.open').forEach(x=>x.classList.remove('open'));if(!was)d.classList.add('open')}
function ddClose(){qsa('.dd.open').forEach(x=>x.classList.remove('open'))}
function closePanels(){closeModal()}
document.addEventListener('click',e=>{qsa('.dd.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')})});

/* ================= STATE ================= */
let ME={name:'',email:'',phone:'',photo:'',bg:''};
let SHOPS=[],SHOPS_RAW=[];
let S={page:'home',q:'',chatShop:null,detailShop:null};
let HIST=[];
let unread={},lastSeen={};
try{unread=JSON.parse(localStorage.getItem('rg_unread')||'{}')}catch(e){}
try{lastSeen=JSON.parse(localStorage.getItem('rg_seen')||'{}')}catch(e){}
let unsubThread=null,myResvs=[];
const uploadingImg={photo:false,bg:false};
const saveUnread=()=>{try{localStorage.setItem('rg_unread',JSON.stringify(unread))}catch(e){}};
const saveSeen=()=>{try{localStorage.setItem('rg_seen',JSON.stringify(lastSeen))}catch(e){}};
const unreadTotal=()=>Object.values(unread).reduce((a,b)=>a+b,0);

/* ================= AUTH (Google) ================= */
async function googleLogin(){
 const b=qs('#gBtn');b.disabled=true;b.innerHTML='<span class="spin"></span><span>Membuka Google...</span>';
 try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
 catch(e){
  if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')
   toast('Gagal masuk: '+(e.message||e),'alert-triangle',true);
  b.disabled=false;b.innerHTML='<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""><span>Lanjutkan dengan Google</span>';
 }
}
async function doLogout(){
 if(unsubThread){unsubThread();unsubThread=null}
 Object.values(inboxUnsubs).forEach(u=>{try{u()}catch(e){}});
 try{await auth.signOut()}catch(e){}
 location.reload();
}

/* ================= PROFIL CUSTOMER (Firestore) ================= */
const myRef=()=>dbFS.collection('customers_app').doc(auth.currentUser.uid);
async function ensureProfile(u){
 const ref=myRef();
 const snap=await ref.get().catch(()=>null);
 if(snap&&snap.exists){
  const d=snap.data()||{};
  ME={name:d.name||u.displayName||'Pelanggan',email:d.email||u.email,phone:d.phone||'',photo:d.photo||u.photoURL||'',bg:d.bg||''};
  await ref.set({name:ME.name,email:ME.email,photo:ME.photo,bg:ME.bg},{merge:true});
 }else{
  ME={name:u.displayName||'Pelanggan',email:u.email||'',phone:'',photo:u.photoURL||'',bg:''};
  await ref.set({name:ME.name,email:ME.email,phone:'',photo:ME.photo,bg:'',createdAt:Date.now()});
 }
}
function saveMe(){
 if(!auth.currentUser)return;
 myRef().set({name:ME.name,phone:ME.phone,photo:ME.photo,bg:ME.bg||''},{merge:true}).catch(e=>console.warn(e));
}

/* ================= UPLOAD FOTO PROFIL & BACKGROUND =================
   preview instan → Cloudinary → Firestore → foto langsung muncul
================================================================ */
async function pickCustomerImg(input,kind){
 const file=input.files[0];if(!file)return;
 if(uploadingImg[kind])return;
 const holder=input.parentNode;
 const local=await fileToDataURL(file);
 const img=holder.querySelector('img');
 if(img)img.src=local;
 else holder.innerHTML=`<img src="${local}" style="width:100%;height:100%;object-fit:cover">`;
 uploadingImg[kind]=true;
 const sb=qs('#epSave');if(sb)sb.disabled=true;
 toast('Mengunggah ke Cloudinary...','upload');
 try{
  const url=await cloudUpload(file);
  if(kind==='photo')ME.photo=url;else ME.bg=url;
  saveMe();
  const im=holder.querySelector('img');if(im)im.src=url;
  renderNav();
  toast(kind==='photo'?'Foto profil diperbarui.':'Background diperbarui.','image');
 }catch(e){
  toast('Upload gagal: '+(e.message||e),'alert-triangle',true);
  const cur=kind==='photo'?ME.photo:ME.bg;
  if(cur){const im=holder.querySelector('img');if(im)im.src=cur;}
 }
 uploadingImg[kind]=false;
 const sb2=qs('#epSave');if(sb2)sb2.disabled=false;
 refreshIcons();
}

/* ================= MUAT BARBERSHOP (acak tiap refresh) ================= */
async function loadShops(){
 SHOPS=[];SHOPS_RAW=[];
 if(S.page==='home'||S.page==='booking')renderSkeleton();
 try{
  const snap=await dbFS.collection('shops').get();
  snap.forEach(doc=>{
   const d=doc.data()||{};
   const p=d.profile||{},s=d.shop||{};
   if(!d.email)return;
   SHOPS_RAW.push({
    uid:doc.id,email:d.email,
    name:(s.name||p.name||'Barbershop'),
    photo:p.photo||'',bg:p.bg||'',address:p.address||'',
    gallery:Array.isArray(p.gallery)?p.gallery.slice(0,9):[],
    capsters:Array.isArray(d.capsters)?d.capsters:[],
    services:Array.isArray(d.services)?d.services:[]
   });
  });
  SHOPS=shuffle(SHOPS_RAW.slice());
  if(S.page==='home')renderShopList();
  if(S.page==='booking')render();
  if(S.page==='detail'&&S.detailShop)render();
 }catch(e){
  toast('Gagal memuat daftar barbershop: '+(e.message||e),'alert-triangle',true);
 }
}

/* ================= ROUTER + BACK HISTORY (semua halaman) ================= */
const NAVI=[['home','Beranda','home'],['booking','Booking','calendar-check'],['chat','Chat','message-circle'],['history','History','clock']];
function snapState(){return{page:S.page,chatShop:S.chatShop,detailShop:S.detailShop,q:S.q}}
function setAva(id,src,name,size){
 const el=qs('#'+id);if(!el)return;
 el.style.width=size+'px';el.style.height=size+'px';el.style.fontSize=Math.round(size*.4)+'px';
 el.innerHTML=src?`<img src="${esc(src)}" alt="">`:esc((name||'?')[0].toUpperCase());
}
function renderNav(){
 const inRoom=S.page==='chat'&&!!S.chatShop;
 const badgeHtml=unreadTotal()?`<span class="nbadge">${unreadTotal()}</span>`:'';
 qs('#navList').innerHTML=`<div class="nsec">MENU</div>`+NAVI.map(([id,lab,ic])=>
  `<button class="nitem ${S.page===id&&!inRoom?'active':''}" onclick="go('${id}')"><i data-lucide="${ic}"></i>${lab}${id==='chat'?badgeHtml:''}</button>`).join('');
 qs('#fnav').innerHTML=NAVI.map(([id,lab,ic])=>
  `<button class="${S.page===id&&!inRoom?'on':''}" onclick="go('${id}')"><i data-lucide="${ic}"></i>${lab}${id==='chat'?badgeHtml:''}</button>`).join('');
 setAva('sbAva',ME.photo,ME.name,36);
 setAva('mhAva',ME.photo,ME.name,32);
 qs('#sbName').textContent=ME.name||'Pelanggan';
 qs('#sbMail').textContent=ME.email||'';
 refreshIcons();
}
/* navigasi — SEMUA perpindahan halaman tercatat di back history */
function go(page,opts){
 opts=opts||{};
 HIST.push(snapState());if(HIST.length>50)HIST.shift();
 try{history.pushState({rg:true},'')}catch(e){}
 S.page=page;S.chatShop=opts.chatShop||null;S.detailShop=opts.detailShop||null;
 if(page==='home'&&opts.keepQ===undefined)S.q='';
 closePanels();render();window.scrollTo(0,0);
}
function goBack(){
 if(HIST.length){
  const prev=HIST.pop();
  S.page=prev.page;S.chatShop=prev.chatShop||null;S.detailShop=prev.detailShop||null;S.q=prev.q||'';
 }else if(S.chatShop){
  S.chatShop=null;S.page='chat';
 }else if(S.page!=='home'){
  S.page='home';S.detailShop=null;
 }
 try{history.replaceState({rg:true},'')}catch(e){}
 closePanels();render();window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{
 if(qs('#app').classList.contains('hide'))return;
 goBack();
});
function render(){
 const inRoom=S.page==='chat'&&!!S.chatShop;
 qs('#sidebar').classList.toggle('hide',inRoom);
 qs('#fnav').classList.toggle('hide',inRoom);
 qs('#mhead').classList.toggle('hide',inRoom);
 qs('#mainCol').classList.toggle('full',inRoom);
 qs('#view').classList.toggle('in-room',inRoom);
 renderNav();
 const V=VIEWS[S.page]||VIEWS.home;
 qs('#view').innerHTML=V();
 if(BIND[S.page])BIND[S.page]();
 refreshIcons();

/* ================= AUTOCOMPLETE SEARCH (beranda) ================= */
let AC_ITEMS=[],AC_SEL=0;
function acHL(text,q){
 const e2=esc(text);if(!q)return e2;
 const i=text.toLowerCase().indexOf(q.toLowerCase());
 if(i<0)return e2;
 return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function acSearch(rawQ){
 const dd=qs('#ddSearch'),menu=qs('#acMenu');
 if(!dd||!menu)return;
 AC_SEL=0;
 const q=(rawQ||'').trim();
 if(!q){dd.classList.remove('open');menu.innerHTML='';AC_ITEMS=[];return}
 const lq=q.toLowerCase();
 AC_ITEMS=SHOPS.filter(s=>
  s.name.toLowerCase().includes(lq)||
  (s.address||'').toLowerCase().includes(lq)||
  (s.services||[]).some(x=>x.name.toLowerCase().includes(lq))
 ).slice(0,6);
 if(!AC_ITEMS.length){
  menu.innerHTML=`<div class="ac-empty">Tidak ada hasil untuk "<b>${esc(q)}</b>"</div><div class="ac-foot">Coba nama toko, alamat, atau nama layanan.</div>`;
 }else{
  menu.innerHTML=AC_ITEMS.map((s,i)=>{
   const svcHit=(s.services||[]).some(x=>x.name.toLowerCase().includes(lq));
   const sub=svcHit?s.address+' · layanan "'+q+'" tersedia':(s.address||((s.services||[]).length+' layanan'));
   return `<button class="ac-item ${i===AC_SEL?'sel':''}" data-i="${i}" onmouseenter="AC_SEL=${i};acPaint()" onclick="acGo(${i})">
    ${avaHTML(s.photo,s.name,34)}
    <span><b>${acHL(s.name,q)}</b><small>${esc(sub)}</small></span>
    <small style="color:var(--tx3);flex:none">${(s.capsters||[]).length} kapster</small>
   </button>`;
  }).join('')+`<div class="ac-foot">${AC_ITEMS.length} hasil · ↑↓ navigasi · Enter buka · Esc tutup</div>`;
 }
 dd.classList.add('open');refreshIcons();
}
function acPaint(){qsa('#acMenu .ac-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===AC_SEL))}
function acKey(e){
 if(!AC_ITEMS.length)return;
 if(e.key==='ArrowDown'){e.preventDefault();AC_SEL=(AC_SEL+1)%AC_ITEMS.length;acPaint();const el=qs(`#acMenu .ac-item[data-i="${AC_SEL}"]`);el&&el.scrollIntoView({block:'nearest'})}
 else if(e.key==='ArrowUp'){e.preventDefault();AC_SEL=(AC_SEL-1+AC_ITEMS.length)%AC_ITEMS.length;acPaint();const el=qs(`#acMenu .ac-item[data-i="${AC_SEL}"]`);el&&el.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();acGo(AC_SEL)}
 else if(e.key==='Escape'){const dd=qs('#ddSearch');dd&&dd.classList.remove('open')}
}
function acGo(i){
 const s=AC_ITEMS[i];if(!s)return;
 const dd=qs('#ddSearch');dd&&dd.classList.remove('open');
 go('detail',{detailShop:s});
}

function bindRoom(){

 if(unsubThread){unsubThread();unsubThread=null}
 lastSeen[s.email]=Date.now();delete unread[s.email];saveSeen();saveUnread();renderNav();

async function sendCustMsg(){
 const s=S.chatShop;if(!s)return;
 const inp=qs('#chatMsg');const text=(inp.value||'').trim();
 if(!text)return;
 inp.value='';
 try{
  await dbFS.collection('chats').doc(s.email).collection('threads').doc(auth.currentUser.uid)
   .collection('messages').add({from:'cust',text,at:Date.now(),name:ME.name});
  await dbFS.collection('chats').doc(s.email).collection('threads').doc(auth.currentUser.uid)
   .set({customerName:ME.name,customerPhone:ME.phone||'',lastText:text,lastFrom:'cust',lastAt:Date.now()},{merge:true});
  await dbFS.collection('userChats').doc(auth.currentUser.uid)
   .set({threads:{[s.email]:{shopEmail:s.email,shopName:s.name,lastText:text,lastAt:Date.now()}}},{merge:true});
  lastSeen[s.email]=Date.now();saveSeen();
  listenInbox();
 }catch(e){
  toast('Gagal mengirim: '+(e.message||e),'alert-triangle',true);
 }
}
const inboxUnsubs={};
function listenInbox(){
 dbFS.collection('userChats').doc(auth.currentUser.uid).get().then(snap=>{
  const threads=(snap.exists&&snap.data().threads)||{};
  Object.keys(threads).forEach(shopEmail=>{
   if(inboxUnsubs[shopEmail])return;
   inboxUnsubs[shopEmail]=dbFS.collection('chats').doc(shopEmail)
    .collection('threads').doc(auth.currentUser.uid)
    .onSnapshot(doc=>{
     if(!doc.exists)return;
     const t=doc.data();
     if(t.lastFrom==='shop'){
      const seen=lastSeen[shopEmail];
      if(seen===undefined){lastSeen[shopEmail]=t.lastAt||0;saveSeen()}
      else if((t.lastAt||0)>seen){
       unread[shopEmail]=(unread[shopEmail]||0)+1;
       saveUnread();renderNav();
       push({icon:'message-circle',title:t.shopName||'Barbershop',sub:t.lastText||'',action:'Buka Chat',dur:6000,onClick:()=>openThreadKey(shopEmail)});
      }
      lastSeen[shopEmail]=Math.max(lastSeen[shopEmail]||0,t.lastAt||0);saveSeen();
     }
    });
  });
 }).catch(()=>{});
}

  <label class="f">No. WhatsApp / HP</label><input id="bkPhone" type="tel" value="${esc(ME.phone||'')}" placeholder="08xxxxxxxxxx">
  ${svcField}
  ${capField}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px">
   <div><label class="f">Tanggal</label><input id="bkDate" type="date" min="${today}" value="${today}"></div>
   <div><label class="f">Jam</label><input id="bkTime" type="time" value="19:00"></div>
  </div>
  <label class="f">Catatan (opsional)</label>
  <textarea id="bkNote" rows="2" placeholder="Contoh: datang berdua, minta yang sabar :)"></textarea>
  <div class="okbox hide" id="bkOk"><i data-lucide="check-circle-2" style="width:16px;height:16px;flex:none"></i><span>Reservasi terkirim! Barbershop menerima notifikasi langsung dan akan mengonfirmasi jadwal.</span></div>
  <div class="mrow">
   <button class="btn gho" onclick="closeModal()">Batal</button>
   <button class="btn pri" id="bkBtn" onclick="submitBooking('${s.uid}')"><i data-lucide="send"></i> Kirim Reservasi</button>
  </div>`);
 if(!ME.phone)setTimeout(()=>{const e=qs('#bkName');e&&e.focus()},80);
}
async function submitBooking(uid){
 const s=shopByUid(uid)||S.detailShop;if(!s)return;
 const name=qv('#bkName'),phone=qv('#bkPhone'),
  service=(qs('#bkSvc')?qs('#bkSvc').value:qv('#bkSvcTxt')),
  cap=(qs('#bkCap')?qs('#bkCap').value:qv('#bkCapTxt')),
  date=qv('#bkDate'),time=qv('#bkTime'),note=qv('#bkNote');
 if(name.length<2)return toast('Isi nama kamu.','alert-triangle',true);
 if(phone.replace(/\D/g,'').length<9)return toast('No. HP tidak valid.','alert-triangle',true);
 if(!service)return toast('Isi layanan yang diinginkan.','alert-triangle',true);
 if(!date||!time)return toast('Pilih tanggal dan jam.','alert-triangle',true);
 const btn=qs('#bkBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Mengirim...';
 try{
  await dbFS.collection('reservations').add({
   shopEmail:s.email,shopName:s.name,
   customerUid:auth.currentUser.uid,
   name,phone,serviceName:service,capsterName:cap||'',
   dateStr:date,timeStr:time,note,
   status:'new',createdAt:Date.now(),source:'customerapp'
  });
  ME.name=name;ME.phone=phone;saveMe();
  const ok=qs('#bkOk');if(ok)ok.classList.remove('hide');
  push({icon:'calendar-check',title:'Reservasi terkirim',sub:s.name+' · '+service+' · '+time,action:'Lihat History',dur:6000,onClick:()=>{closeModal();go('history')}});
  setTimeout(()=>{closeModal();go('history')},1400);
 }catch(e){
  toast('Gagal mengirim reservasi: '+(e.message||e),'alert-triangle',true);
  btn.disabled=false;btn.innerHTML='<i data-lucide="send"></i> Kirim Reservasi';refreshIcons();
 }
}

function epSave(){
 const name=qv('#epName'),phone=qv('#epPhone');
 if(name.length<2)return toast('Nama terlalu pendek.','alert-triangle',true);
 if(phone&&phone.replace(/\D/g,'').length<9)return toast('No. HP tidak valid.','alert-triangle',true);
 ME.name=name;ME.phone=phone;saveMe();
 closeModal();render();renderNav();
 toast('Profil diperbarui &amp; tersimpan ke Firestore.','check-circle-2');
}

  <div style="padding:14px 0 2px;text-align:center">

   <div class="mono" style="font-size:10px;color:var(--tx3);letter-spacing:.12em;margin-top:2px">VERSI 1.3.0 · FIRESTORE · CLOUDINARY</div>
  </div>
  <div class="mrow"><button class="btn gho" onclick="closeModal()">Tutup</button></div>`);

function toggleTheme(){
 const dark=document.body.classList.toggle('dark');
 localStorage.setItem('rg_theme',dark?'dark':'light');
 openSettings();renderNav();
 toast('Mode '+(dark?'gelap':'terang')+' aktif.',dark?'moon':'sun');
}

/* ================= THEME / BOOT ================= */
function applyTheme(){document.body.classList.toggle('dark',(localStorage.getItem('rg_theme')||'light')==='dark')}
applyTheme();
refreshIcons();

auth.onAuthStateChanged(async user=>{
 if(user){
  qs('#login').classList.add('hide');
  qs('#app').classList.remove('hide');
  await ensureProfile(user);
  render();
  await loadShops();
  loadHistory().catch(()=>{});
  listenInbox();
 }else{
  qs('#app').classList.add('hide');
  qs('#login').classList.remove('hide');
  const b=qs('#gBtn');
  b.disabled=false;b.innerHTML='<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""><span>Lanjutkan dengan Google</span>';
 }
});
