<script>
/* ============================================================
   ★ FIX #1: Guard global — js dijalankan SETELAH DOM siap &
   qs/qsa dibungkus try-catch + window.onerror agar error
   'querySelector of undefined/null' tidak pernah crash app.
============================================================ */
window.addEventListener('error',function(e){
 try{console.warn('[BarberGo Guard]',e.message)}catch(_){}
});
const qs=s=>{try{return document.querySelector(s)}catch(e){return null}};
const qsa=s=>{try{return [...document.querySelectorAll(s)]}catch(e){return []}};
const qv=s=>{const e=qs(s);return e?e.value.trim():''};

/* ================= FIREBASE & CLOUDINARY ================= */
const firebaseConfig={apiKey:"AIzaSyCXMkjGhSjnJzZEbZ5_hpZtSEQ-rkl2dbk",authDomain:"mattpos.firebaseapp.com",projectId:"mattpos",storageBucket:"mattpos.firebasestorage.app",messagingSenderId:"42578217144",appId:"1:42578217144:web:ce1885354d692cce284c4d",measurementId:"G-0LZ2SJ8VRJ"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const dbFS=firebase.firestore();
const CLOUD_NAME='o9nnrrra',CLOUD_PRESET='Barbergo';

/* ================= UTIL ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const ftime=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function refreshIcons(){try{lucide.createIcons()}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f)})}
function avaHTML(src,name,size){const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px`;
 if(src)return `<span class="pav" style="${st}"><img src="${esc(src)}" alt=""></span>`;
 return `<span class="pav" style="${st}">${esc((name||'?')[0].toUpperCase())}</span>`}
async function cloudUpload(file){
 const fd=new FormData();
 fd.append('file',file);fd.append('upload_preset',CLOUD_PRESET);fd.append('folder','barbergo-customers');
 const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:'POST',body:fd});
 if(!res.ok)throw new Error('HTTP '+res.status);
 const j=await res.json();
 if(!j.secure_url)throw new Error((j.error&&j.error.message)||'respons tidak valid');
 return j.secure_url;
}

/* ================= PUSH / MODAL / DROPDOWN ================= */
function push(o){
 o=Object.assign({icon:'bell',title:'',sub:'',action:'',dur:4800,onClick:null},o);
 const stack=qs('#pushStack');if(!stack)return null;
 while(stack.children.length>=3)stack.firstElementChild.remove();
 const el=document.createElement('div');el.className='push';
 el.innerHTML=`<span class="pic"><i data-lucide="${o.icon}"></i></span>
  <span class="pt"><b>${esc(o.title)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}${o.action?`<span style="display:block;font-size:11px;font-weight:700;color:var(--blue);margin-top:5px">${esc(o.action)} →</span>`:''}</span>
  <button class="px"><i data-lucide="x"></i></button>
  <span class="prog"><i style="animation-duration:${o.dur}ms"></i></span>`;
 function kill(){el.classList.add('out');setTimeout(()=>el.remove(),260)}
 /* ★ FIX #2: guard querySelector hasil push */
 const px=el.querySelector('.px');if(px)px.addEventListener('click',e=>{e.stopPropagation();kill()});
 el.addEventListener('click',()=>{o.onClick&&o.onClick();kill()});
 const prog=el.querySelector('.prog i');if(prog)prog.addEventListener('animationend',kill);
 stack.appendChild(el);refreshIcons();
 return el; /* ★ dikembalikan agar toast() bisa mewarnai icon error */
}
function toast(msg,icon='check-circle-2',err=false){
 const el=push({icon:err?'alert-triangle':icon,title:msg,dur:3000});
 if(el&&err){const p=el.querySelector('.pic');if(p)p.style.background='var(--dn)'}
}
function openModal(html){
 const r=qs('#modalRoot');if(!r)return;
 r.innerHTML=`<div class="modal">${html}</div>`;r.classList.add('on');
 const sc=qs('#scrim');if(sc)sc.classList.add('on');
 refreshIcons();
}
function closeModal(){
 const r=qs('#modalRoot');if(!r)return;
 r.classList.remove('on');r.innerHTML='';
 const sc=qs('#scrim');if(sc)sc.classList.remove('on');
}
function ddToggle(id,e){
 e&&e.stopPropagation();
 const d=qs('#'+id);if(!d)return; /* ★ FIX #3: guard null */
 const was=d.classList.contains('open');
 qsa('.dd.open').forEach(x=>x.classList.remove('open'));
 if(!was)d.classList.add('open');
}
function ddClose(){qsa('.dd.open').forEach(x=>x.classList.remove('open'))}
function closePanels(){closeModal()}
document.addEventListener('click',e=>{qsa('.dd.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')})});

/* ============================================================
   ★ NOTIFIKASI PUSH (FCM + SUARA) — BLOK BARU
============================================================ */
const VAPID_KEY='BKWQ_q8Xx81q7wRlcYZS02viVHgHUWuqZAIGJNtPBM7b3KUSQWRWHhPoNF-uc8OhOxsKdv2Rexxis51X3AD5Alg';
let fcm=null,SW_REG=null;
try{fcm=firebase.messaging.isSupported()?firebase.messaging():null}catch(e){fcm=null}

/* ---- Suara notifikasi (Web Audio "ting-ton", tanpa file mp3) ---- */
const soundOn=()=>localStorage.getItem('rg_sound')!=='off';
let audioCtx=null;
function playNotifSound(){
 if(!soundOn())return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  [[880,0],[1244.5,.13]].forEach(([f,off])=>{ /* nada "ting-ton" */
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();
   o.type='sine';o.frequency.value=f;
   g.gain.setValueAtTime(.0001,t+off);
   g.gain.exponentialRampToValueAtTime(.22,t+off+.03);
   g.gain.exponentialRampToValueAtTime(.0001,t+off+.55);
   o.connect(g);g.connect(audioCtx.destination);
   o.start(t+off);o.stop(t+off+.6);
  });
 }catch(e){}
}

/* ---- Registrasi Service Worker ---- */
async function registerSW(){
 if(!('serviceWorker' in navigator))return null;
 if(SW_REG)return SW_REG;
 try{SW_REG=await navigator.serviceWorker.register('/firebase-messaging-sw.js');return SW_REG}
 catch(e){console.warn('[FCM] SW gagal didaftarkan:',e);return null}
}

/* ---- Simpan token ke Firestore (dibaca server/POS utk kirim notif) ---- */
async function saveFcmToken(token){
 if(!token||!auth.currentUser)return;
 try{
  await dbFS.collection('fcm_tokens').doc(token).set({
   token,ownerUid:auth.currentUser.uid,role:'customer',
   name:ME.name||'',email:ME.email||'',updatedAt:Date.now()
  },{merge:true});
  const upd={};upd['fcmTokens.'+token]={updatedAt:Date.now(),ua:(navigator.userAgent||'').slice(0,180)};
  await myRef().set(upd,{merge:true});
 }catch(e){console.warn('[FCM] simpan token gagal:',e)}
}

async function getTokenAndSave(retry){
 retry=retry||0;
 if(!fcm||(('Notification' in window)&&Notification.permission!=='granted'))return;
 try{
  const reg=SW_REG||await registerSW();
  const token=await fcm.getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg||undefined});
  if(token)await saveFcmToken(token);
 }catch(e){
  if(retry<4)return setTimeout(()=>getTokenAndSave(retry+1),1500); /* tunggu SW aktif (kunjungan pertama) */
  console.warn('[FCM] getToken gagal:',e);
 }
}

/* ---- Dedupe agar notif tidak dobel ---- */
const _nseen={};
function notifFresh(key){
 const now=Date.now();
 if(_nseen[key])return false;
 _nseen[key]=now;
 Object.keys(_nseen).forEach(k=>{if(now-_nseen[k]>30000)delete _nseen[k]});
 return true;
}

/* ---- Pesan FCM saat app TERBUKA (foreground) ---- */
function initFcmListeners(){
 if(!fcm||fcm._rgListen)return;
 fcm._rgListen=true;
 fcm.onMessage(payload=>{
  const n=payload.notification||{},d=payload.data||{};
  /* chat & reservasi sudah ditangani listener realtime Firestore → skip agar tidak dobel */
  if(d.type==='chat'||d.type==='resv')return;
  const key='fcm:'+(d.key||d.messageId||((n.title||'')+'|'+(n.body||'')));
  if(!notifFresh(key))return;
  playNotifSound();
  push({icon:d.icon||'bell-ring',title:n.title||d.title||'BarberGo',sub:n.body||d.body||'',dur:6000,
   onClick:d.link?()=>{try{location.href=d.link}catch(e){}}:null});
 });
 try{fcm.onTokenRefresh(()=>getTokenAndSave())}catch(e){}
}

/* ---- Modal permintaan izin (UX lebih baik dari prompt browser langsung) ---- */
function showPushAskModal(){
 openModal(`<h3>Aktifkan Notifikasi 🔔</h3>
 <p style="font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:6px">Dapatkan <b>notifikasi pesan chat</b> dari barbershop &amp; <b>update status reservasi</b> secara real-time — lengkap dengan suara.</p>
 <div class="mrow"><button class="btn gho" onclick="closeModal()">Nanti Saja</button><button class="btn pri" onclick="enablePush()"><i data-lucide="bell-ring" style="width:14px;height:14px"></i> Aktifkan</button></div>`);
}

async function enablePush(){
 closeModal();
 if(!('Notification' in window))return toast('Browser tidak mendukung notifikasi.','alert-triangle',true);
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted')return toast('Izin notifikasi tidak diberikan.','bell-off',true);
  toast('Notifikasi diaktifkan!','bell-ring');
  await registerSW();await getTokenAndSave();initFcmListeners();
  if(S.page==='settings')render();
 }catch(e){toast('Gagal mengaktifkan notifikasi: '+(e.message||e),'alert-triangle',true)}
}

async function initPushFlow(){
 if(!('Notification' in window)||!('serviceWorker' in navigator))return;
 if(Notification.permission==='granted'){
  await registerSW();await getTokenAndSave();initFcmListeners();
 }else if(Notification.permission==='default'&&!localStorage.getItem('rg_push_asked')){
  localStorage.setItem('rg_push_asked','1');
  setTimeout(showPushAskModal,2500); /* muncul setelah app siap */
 }
}

/* ---- Hapus token saat logout ---- */
async function removeFcmToken(){
 if(!fcm||!auth.currentUser)return;
 try{
  const tok=await fcm.getToken({vapidKey:VAPID_KEY}).catch(()=>null);
  if(tok){
   await dbFS.collection('fcm_tokens').doc(tok).delete().catch(()=>{});
   const upd={};upd['fcmTokens.'+tok]=firebase.firestore.FieldValue.delete();
   await myRef().set(upd,{merge:true}).catch(()=>{});
  }
  await fcm.deleteToken().catch(()=>{});
 }catch(e){}
}

/* ---- Notif perubahan status reservasi (realtime) ---- */
let unsubResv=null,resvFirstSnap=true;
const RESV_NOTIF={
 received:{icon:'check-circle-2',t:'Reservasi Dikonfirmasi ✅',s:'Toko telah menerima reservasimu.'},
 cancelled:{icon:'x-circle',t:'Reservasi Dibatalkan ❌',s:'Toko membatalkan reservasimu.'},
 done:{icon:'badge-check',t:'Reservasi Selesai 🎉',s:'Terima kasih sudah berkunjung!'}
};
function watchReservations(){
 if(unsubResv)unsubResv();
 resvFirstSnap=true;
 unsubResv=dbFS.collection('reservations').where('customerUid','==',auth.currentUser.uid)
 .onSnapshot(snap=>{
  if(resvFirstSnap){resvFirstSnap=false;return} /* lewati load awal */
  snap.docChanges().forEach(ch=>{
   if(ch.type==='removed')return;
   const r=ch.doc.data()||{},info=RESV_NOTIF[r.status];
   if(!info||!notifFresh('resv:'+ch.doc.id+':'+r.status))return;
   playNotifSound();
   push({icon:info.icon,title:info.t,sub:(r.shopName||'Barbershop')+' · '+(r.serviceName||'')+' — '+info.s,dur:6500,
    onClick:()=>{if(S.page!=='history')go('history')}});
   if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    try{
     const n=new Notification(info.t,{body:(r.shopName||'Barbershop')+' · '+(r.serviceName||''),icon:'/favicon.png',tag:ch.doc.id});
     n.onclick=()=>{window.focus();n.close()};
    }catch(e){}
   }
  });
 },()=>{});
}

/* ================= UPLOAD FOTO — ★ FIX #4: stable-ID lookup, bukan parentNode ================= */
async function pickCustomerImg(input,kind){
 if(!input)return;
 const file=input.files&&input.files[0];if(!file)return;
 if(uploadingImg[kind])return;
 /* ★ holder dicari lewat ID stabil (selalu ada), fallback aman ke parentNode */
 const holder=qs(kind==='photo'?'#epAvaBox':'#epBgBox')||input.parentNode;
 const local=await fileToDataURL(file);
 if(holder){
  const img=holder.querySelector('img');
  if(img)img.src=local;
  else holder.insertAdjacentHTML('afterbegin',`<img src="${local}" style="width:100%;height:100%;object-fit:cover">`);
 }
 uploadingImg[kind]=true;
 const sb=qs('#epSave');if(sb)sb.disabled=true;
 toast('Mengunggah ke Cloudinary...','upload');
 try{
  const url=await cloudUpload(file);
  if(kind==='photo')ME.photo=url;else ME.bg=url;
  saveMe();
  if(holder){const im=holder.querySelector('img');if(im)im.src=url}
  renderNav();
  toast(kind==='photo'?'Foto profil diperbarui.':'Background diperbarui.','image');
 }catch(e){
  toast('Upload gagal: '+(e.message||e),'alert-triangle',true);
  const cur=kind==='photo'?ME.photo:ME.bg;
  if(cur&&holder){const im=holder.querySelector('img');if(im)im.src=cur}
 }
 uploadingImg[kind]=false;
 const sb2=qs('#epSave');if(sb2)sb2.disabled=false;
 refreshIcons();
}

async function loadShops(){
 SHOPS=[];SHOPS_RAW=[];
 if(S.page==='home'||S.page==='booking')renderSkeleton();
 try{
  const snap=await dbFS.collection('shops').get();
  snap.forEach(doc=>{
   const d=doc.data()||{};
   const p=d.profile||{},s=d.shop||{};
   if(!d.email)return;
   SHOPS_RAW.push({
    uid:doc.id,email:d.email,
    name:(s.name||p.name||'Barbershop'),
    photo:p.photo||'',bg:p.bg||'',address:p.address||'',
    gallery:Array.isArray(p.gallery)?p.gallery.slice(0,9):[],
    capsters:Array.isArray(d.capsters)?d.capsters:[],
    services:Array.isArray(d.services)?d.services:[],
    queue:Array.isArray(d.queue)?d.queue:[]
   });
  });
  SHOPS=shuffle(SHOPS_RAW.slice());

  if(S.page==='booking')render();
  if(S.page==='detail'&&S.detailShop)render();
 }catch(e){

/* ================= FILTER LOKASI ================= */
let LOCS=[];
function extractLocations(){
 const map={};
 SHOPS_RAW.forEach(s=>{
  const addr=(s.address||'').trim();
  if(!addr)return;
  addr.split(',').map(x=>x.trim()).forEach(part=>{
   if(part.length>=3&&part.length<=32&&!/^\d/.test(part))map[part]=(map[part]||0)+1;
  });
 });
 LOCS=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
}
function locSelHTML(){
 extractLocations();
 return `<div class="locbar"><i data-lucide="map-pin"></i>
  <select onchange="S.loc=this.value;renderShopList();renderBkList()" title="Filter lokasi">
   <option value="">Semua Lokasi</option>
   ${LOCS.map(l=>`<option value="${esc(l)}" ${S.loc===l?'selected':''}>${esc(l)} (${SHOPS_RAW.filter(s=>(s.address||'').toLowerCase().includes(l.toLowerCase())).length})</option>`).join('')}
  </select></div>`;
}
function locFiltered(list){
 if(!S.loc)return list;
 const l=S.loc.toLowerCase();
 return list.filter(s=>(s.address||'').toLowerCase().includes(l));
}

function stopListeners(){

function go(page,opts){
 opts=opts||{};
 stopListeners();
 HIST.push(snapState());if(HIST.length>50)HIST.shift();
 try{history.pushState({rg:true},'')}catch(e){}
 S.page=page;S.chatShop=opts.chatShop||null;S.detailShop=opts.detailShop||null;
 if(page==='home'&&opts.keepQ===undefined)S.q='';
 closePanels();render();window.scrollTo(0,0);
}
function goBack(){
 stopListeners();
 if(HIST.length){
  const prev=HIST.pop();
  S.page=prev.page;S.chatShop=prev.chatShop||null;S.detailShop=prev.detailShop||null;S.q=prev.q||'';S.loc=prev.loc||'';
 }else if(S.chatShop){
  S.chatShop=null;S.page='chat';
 }else if(S.page!=='home'){
  S.page='home';S.detailShop=null;
 }
 try{history.replaceState({rg:true},'')}catch(e){}
 closePanels();render();window.scrollTo(0,0);
}

/* ================= AUTOCOMPLETE ================= */
let AC_ITEMS=[],AC_SEL=0;
function acHL(text,q){
 const e2=esc(text);if(!q)return e2;
 const i=text.toLowerCase().indexOf(q.toLowerCase());
 if(i<0)return e2;
 return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function acSearch(rawQ){
 const dd=qs('#ddSearch'),menu=qs('#acMenu');
 if(!dd||!menu)return;
 AC_SEL=0;
 const q=(rawQ||'').trim();
 if(!q){dd.classList.remove('open');menu.innerHTML='';AC_ITEMS=[];return}
 const lq=q.toLowerCase();
 const pool=S.loc?locFiltered(SHOPS):SHOPS;
 AC_ITEMS=pool.filter(s=>
  s.name.toLowerCase().includes(lq)||
  (s.address||'').toLowerCase().includes(lq)||
  (s.services||[]).some(x=>x.name.toLowerCase().includes(lq))
 ).slice(0,6);
 if(!AC_ITEMS.length){
  menu.innerHTML=`<div class="ac-empty">Tidak ada hasil untuk "<b>${esc(q)}</b>"</div><div class="ac-foot">Coba nama toko, alamat, atau nama layanan.</div>`;
 }else{
  menu.innerHTML=AC_ITEMS.map((s,i)=>{
   const svcHit=(s.services||[]).some(x=>x.name.toLowerCase().includes(lq));
   const sub=svcHit?s.address+' · layanan "'+q+'" tersedia':(s.address||((s.services||[]).length+' layanan'));
   return `<button class="ac-item ${i===AC_SEL?'sel':''}" data-i="${i}" onmouseenter="AC_SEL=${i};acPaint()" onclick="acGo(${i})">
    ${avaHTML(s.photo,s.name,34)}
    <span><b>${acHL(s.name,q)}</b><small>${esc(sub)}</small></span>
    <small style="color:var(--tx3);flex:none">${(s.capsters||[]).length} kapster</small>
   </button>`;
  }).join('')+`<div class="ac-foot">${AC_ITEMS.length} hasil · ↑↓ navigasi · Enter buka · Esc tutup</div>`;
 }
 dd.classList.add('open');refreshIcons();
}
function acPaint(){qsa('#acMenu .ac-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===AC_SEL))}
function acKey(e){
 if(!AC_ITEMS.length)return;
 if(e.key==='ArrowDown'){e.preventDefault();AC_SEL=(AC_SEL+1)%AC_ITEMS.length;acPaint();const el=qs(`#acMenu .ac-item[data-i="${AC_SEL}"]`);if(el)el.scrollIntoView({block:'nearest'})}
 else if(e.key==='ArrowUp'){e.preventDefault();AC_SEL=(AC_SEL-1+AC_ITEMS.length)%AC_ITEMS.length;acPaint();const el=qs(`#acMenu .ac-item[data-i="${AC_SEL}"]`);if(el)el.scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'){e.preventDefault();acGo(AC_SEL)}
 else if(e.key==='Escape'){const dd=qs('#ddSearch');if(dd)dd.classList.remove('open')}
}
function acGo(i){
 const s=AC_ITEMS[i];if(!s)return;
 const dd=qs('#ddSearch');if(dd)dd.classList.remove('open');
 go('detail',{detailShop:s});
}

  const d=(doc&&doc.data?doc.data():{})||{};

function openBooking(uid){
 const s=shopByUid(uid);if(!s)return toast('Toko tidak ditemukan.','info');
 if(!(s.services||[]).length)return toast('Toko belum punya daftar layanan.','info');
 const today=dkey(new Date());
 openModal(`<h3>Reservasi — ${esc(s.name)}</h3><div class="msub">Isi jadwal, toko akan konfirmasi lewat panel kasir mereka.</div>
 <label class="f">Layanan</label><select id="bkSvc">${s.services.map(x=>`<option value="${esc(x.name)}|${x.price||0}">${esc(x.name)} — ${fmt(x.price)}</option>`).join('')}</select>
 <label class="f">Capster</label><select id="bkCap"><option value="">— Bebas (sesuai antrian) —</option>${(s.capsters||[]).map(c=>`<option>${esc(c.name)}</option>`).join('')}</select>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <div><label class="f">Tanggal</label><input id="bkDate" type="date" value="${today}" min="${today}"></div>
  <div><label class="f">Jam</label><input id="bkTime" type="time" value="10:00"></div>
 </div>
 <label class="f">Catatan (opsional)</label><input id="bkNote" placeholder="Contoh: potong fade">
 <div class="mrow"><button class="btn gho" onclick="closeModal()">Batal</button><button class="btn pri" id="bkGo"><i data-lucide="send" style="width:14px;height:14px"></i> Kirim Reservasi</button></div>`);
 const go_=qs('#bkGo');if(go_)go_.onclick=()=>submitBooking(s);
}
async function submitBooking(s){
 const b=qs('#bkGo');if(!b)return;
 const svcEl=qs('#bkSvc'),dateEl=qs('#bkDate'),timeEl=qs('#bkTime'),capEl=qs('#bkCap'),noteEl=qs('#bkNote');
 if(!svcEl||!dateEl||!timeEl)return;
 const svcRaw=svcEl.value.split('|');
 const svcName=svcRaw[0],price=Number(svcRaw[1]||0);
 const date=dateEl.value,time=timeEl.value;
 if(!date||!time)return toast('Pilih tanggal & jam.','alert-triangle',true);
 b.disabled=true;b.innerHTML='<span class="spin"></span>';
 try{
  await dbFS.collection('reservations').add({
   shopEmail:s.email,shopUid:s.uid,shopName:s.name,
   customerUid:auth.currentUser.uid,
   name:ME.name||'Pelanggan',phone:ME.phone||'-',
   serviceName:svcName,servicePrice:price,
   capsterName:capEl?capEl.value:'',
   dateStr:date,timeStr:time,note:noteEl?noteEl.value.trim():'',
   status:'new',createdAt:Date.now()
  });
  closeModal();
  openModal(`<h3>Reservasi Terkirim 🎉</h3><p style="font-size:12.5px;color:var(--tx2);line-height:1.7;margin-top:6px"><b>${esc(s.name)}</b> menerima permintaanmu untuk <b>${esc(svcName)}</b> pada <b>${fdate(new Date(date+'T'+time))}, ${esc(time)}</b>. Toko akan konfirmasi — pantau statusnya di menu History.</p><div class="mrow"><button class="btn gho" onclick="closeModal()">Tutup</button><button class="btn pri" onclick="closeModal();go('history')">Lihat History</button></div>`);
  /* ★ NOTIFIKASI: fix — push() butuh objek, bukan argumen posisi */
  playNotifSound();
  push({icon:'check-circle-2',title:'Reservasi terkirim 🎉',sub:s.name+' · '+svcName,dur:5000});
 }catch(e){toast('Gagal mengirim: '+(e.message||e),'alert-triangle',true);b.disabled=false;b.innerHTML='<i data-lucide="send" style="width:14px;height:14px"></i> Kirim Reservasi';refreshIcons()}
}

/* ---------- CHAT ---------- */
const myTid=()=>'c_'+auth.currentUser.uid;

/* ---- ★ NOTIFIKASI: pesan chat baru dari toko ---- */
function notifyNewMessage(s,d){
 const key='chat:'+s.uid+':'+(d.lastText||'')+':'+(d.lastAt||0);
 if(!notifFresh(key))return;
 playNotifSound();
 push({icon:'message-circle',title:s.name,sub:d.lastText||'Pesan baru dari barbershop',action:'Buka chat',dur:6000,
  onClick:()=>{if(!(S.page==='chat'&&S.chatShop===s.uid))startChat(s.uid)}});
 if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
  try{
   const n=new Notification(s.name,{body:d.lastText||'Pesan baru',icon:'/favicon.png',tag:'chat-'+s.uid});
   n.onclick=()=>{window.focus();n.close();startChat(s.uid)};
  }catch(e){}
 }
}

function startInbox(){
 Object.values(inboxUnsubs).forEach(u=>{try{u()}catch(e){}});
 inboxUnsubs={};
 SHOPS_RAW.forEach(s=>{
  if(!s.email)return;
  inboxUnsubs[s.uid]=dbFS.collection('chats').doc(s.email).collection('threads').doc(myTid())
   .onSnapshot(doc=>{
    const d=doc&&doc.data?doc.data():null;
    const prevAt=(inboxMeta[s.uid]&&inboxMeta[s.uid].lastAt)||0;
    /* sedang di ruang chat tsb & layar aktif → anggap sudah dibaca */
    const inRoom=S.page==='chat'&&S.chatShop===s.uid&&!document.hidden;
    if(inRoom){lastSeen[s.uid]=Date.now();saveSeen()}
    inboxMeta[s.uid]=d||null;
    if(d&&d.lastFrom==='shop'&&!inRoom&&(d.lastAt||0)>(lastSeen[s.uid]||0)){
     unread[s.uid]=1;
     if(prevAt&&(d.lastAt||0)>prevAt)notifyNewMessage(s,d); /* lewati load pertama */
    }else if(!inRoom)delete unread[s.uid];
    saveUnread();renderNav();
   },()=>{});
 });
}
function chatLastText(s){
 const m=inboxMeta[s.uid];
 if(!m||!m.lastText)return 'Mulai percakapan…';
 return (m.lastFrom==='cust'?'Kamu: ':'')+m.lastText;
}
function chatLastTime(s){
 const m=inboxMeta[s.uid];
 return m&&m.lastAt?ftime(m.lastAt):'';
}
function startChat(uid){
 const s=shopByUid(uid);if(!s)return toast('Toko tidak ditemukan.','info');
 if(!s.email)return toast('Toko ini belum mengaktifkan chat.','info');
 go('chat',{chatShop:uid});
}

BIND.chat=()=>{
 if(!S.chatShop)return;
 const s=shopByUid(S.chatShop);if(!s||!s.email)return;
 const tRef=dbFS.collection('chats').doc(s.email).collection('threads').doc(myTid());
 if(unsubThread)unsubThread();
 unread[s.uid]=0;lastSeen[s.uid]=Date.now();saveSeen();renderNav();
 unsubThread=tRef.collection('messages').orderBy('at').onSnapshot(snap=>{
  const box=qs('#msgs');if(!box)return;
  const msgs=snap.docs.map(d=>d.data());
  box.innerHTML=msgs.length?msgs.map(m=>`<div class="bub ${m.from==='cust'?'me':'cust'}">${esc(m.text)}<span class="bt">${ftime(m.at)}</span></div>`).join(''):'<div class="empty"><i data-lucide="message-circle"></i><p>Mulai percakapan dengan toko…</p></div>';
  box.scrollTop=box.scrollHeight;refreshIcons();
 },()=>{});
};
async function sendMsg(uid){
 const s=shopByUid(uid);if(!s||!s.email)return;
 const inp=qs('#msgIn');if(!inp)return;
 const text=(inp.value||'').trim();if(!text)return;
 inp.value='';
 const tRef=dbFS.collection('chats').doc(s.email).collection('threads').doc(myTid());
 try{
  await tRef.collection('messages').add({from:'cust',text,at:Date.now(),name:ME.name||'Pelanggan'});
  await tRef.set({lastText:text,lastFrom:'cust',lastAt:Date.now(),customerName:ME.name||'Pelanggan',customerPhone:ME.phone||'-'},{merge:true});
 }catch(e){toast('Gagal mengirim pesan.','alert-triangle',true)}
}

async function loadHistory(){
 const el=qs('#hList');if(!el)return;
 try{
  const snap=await dbFS.collection('reservations').where('customerUid','==',auth.currentUser.uid).get();
  const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!rows.length){el.innerHTML='<div class="card" style="padding:8px"><div class="empty"><i data-lucide="clock"></i><p>Belum ada reservasi.<br>Buat dari halaman Booking!</p></div></div>';refreshIcons();return}
  el.innerHTML='<div class="card pad">'+rows.map(r=>{
   const st=r.status==='received'?['Dikonfirmasi','b-paid']:r.status==='cancelled'?['Dibatalkan','b-can']:r.status==='done'?['Selesai','b-paid']:['Menunggu Konfirmasi','b-pend'];
   const when=r.dateStr?`${fdate(new Date(r.dateStr+'T'+(r.timeStr||'00:00')))} · ${esc(r.timeStr||'')}`:'—';
   return `<div class="hrow">
    <div class="in"><b>${esc(r.shopName||'Barbershop')}</b>
     <small>${esc(r.serviceName||'-')}${r.capsterName?' · '+esc(r.capsterName):''} · ${when}</small></div>
    <span class="badge ${st[1]}">${st[0]}</span>
   </div>`}).join('')+'</div>';
 }catch(e){el.innerHTML='<div class="card" style="padding:8px"><div class="empty"><p>Gagal memuat: '+esc(e.message||e)+'</p></div></div>'}
 refreshIcons();
}

if(localStorage.getItem('rg_theme')==='dark')document.body.classList.add('dark');
if('serviceWorker' in navigator){
 try{navigator.serviceWorker.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.type==='NOTIF_CLICK'&&d.link){try{location.href=d.link}catch(_){}}
 })}catch(e){}
}
auth.onAuthStateChanged(async u=>{
 if(u){
  const app=qs('#app'),lg=qs('#login');

  await ensureProfile(u);
  renderNav();
  loadShops();
  watchReservations();   /* ★ notif status reservasi realtime */
  initPushFlow();        /* ★ FCM: izin + token + listener foreground */
 }else{
  const app=qs('#app'),lg=qs('#login');
  if(app)app.classList.add('hide');
  if(lg)lg.classList.remove('hide');
 }
});
